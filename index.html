<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>一站式学习 · 408 / 上机实战 / PTA乙级</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#eef1f6;color:#1f2733;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{background:#0f172a;color:#fff;padding:14px 16px;font-size:16px;font-weight:600;}
  header span{color:#64748b;font-size:12px;font-weight:400;margin-left:6px;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
  h1{font-size:20px;margin:6px 0 14px;}
  .card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(30,50,90,.06);margin:12px 0;}
  .card h2{font-size:15px;margin:0 0 10px;}
  .prog{margin:12px 0;}
  .prog .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:10px;}
  .bar{height:12px;background:#eef2f9;border-radius:7px;overflow:hidden;}
  .bar i{display:block;height:100%;background:#2563eb;border-radius:7px;}
  .bar i.g{background:#2f9e44;} .bar i.o{background:#e8590c;}
  .meta{font-size:12.5px;color:#6b7686;margin-top:5px;}
  a.big{display:block;text-decoration:none;color:#1f2733;background:#fff;border-radius:14px;
    padding:18px;margin:12px 0;box-shadow:0 2px 10px rgba(30,50,90,.08);display:flex;align-items:center;justify-content:space-between;}
  a.big b{font-size:17px;} a.big small{display:block;color:#6b7686;font-size:12.5px;margin-top:3px;font-weight:400;}
  a.big .arrow{color:#2563eb;font-size:20px;}
  a.big.blue{border-left:5px solid #2563eb;}
  a.big.green{border-left:5px solid #0f766e;}
  a.big.orange{border-left:5px solid #e8590c;}
  a.big.indigo{border-left:5px solid #4338ca;}
  .tip{font-size:14.5px;line-height:1.9;}
  .todo{list-style:none;padding:0;margin:6px 0 0;}
  .todo li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed #eef2f9;font-size:14.5px;}
  .todo input{width:18px;height:18px;}
  .todo label.done{color:#9aa4b2;text-decoration:line-through;}
  .note{font-size:12.5px;color:#8a95a6;margin-top:8px;}
  .qbtn{border:0;border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer;background:#e8eef6;color:#2563eb;margin-top:8px;}
</style>
</head>
<body>
<header>一站式学习<span>v4</span></header>
<div class="wrap">
  <div id="dashTop"></div>

  <a class="big blue" href="上机实战/index.html">
    <span><b>💻 上机实战</b><small>0 基础 C / 数据结构 · 在线运行 + 判题 + 错题本</small></span>
    <span class="arrow">进入 →</span>
  </a>
  <a class="big orange" href="408学习/index.html">
    <span><b>📘 408 知识点</b><small>数据结构/计组/操作系统/网络 · 100 知识点 + 例题 + 问答</small></span>
    <span class="arrow">进入 →</span>
  </a>
  <a class="big green" href="PTA乙级训练/index.html">
    <span><b>🎯 PTA 乙级</b><small>从 0 到乙级 · 16 节 + 1001~1050 刷题清单</small></span>
    <span class="arrow">进入 →</span>
  </a>
  <a class="big indigo" href="guide.html">
    <span><b>🗂 学习指南</b><small>各模块说明 + 0 基础→上岸 学习路线</small></span>
    <span class="arrow">进入 →</span>
  </a>

  <div class="card"><h2>💡 今日学习建议</h2><div class="tip" id="tips"></div>
    <button class="qbtn" id="refresh">🔄 刷新进度</button>
    <div class="note">进度取自本机浏览器存储。用同一个网址打开各模块，进度才会同步显示在首页。</div>
  </div>
  <div class="card"><h2>✅ 今日目标（打勾）</h2><ul class="todo" id="todo"></ul></div>
</div>

<script>
function cnt(k){ try{ return Object.keys(JSON.parse(localStorage.getItem(k)||"{}")).length; }catch(e){ return 0; } }
function num(k,d){ var v=parseInt(localStorage.getItem(k)||"",10); return isNaN(v)?d:v; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function render(){
  var L408=cnt("c408_learned"),T408=100;
  var SJp=cnt("sj_passed_v1"),SJt=num("sj_total_v1",36),SJw=cnt("sj_wrong_v1");
  var PTp=cnt("pta_passed_v1"),PTt=num("pta_total_v1",17),PTw=cnt("pta_wrong_v1");
  function bar(name,p,t,color,sub){
    var pc=t?Math.round(p/t*100):0;
    return '<div class="prog"><div class="top"><span>'+name+'</span><span>'+p+' / '+t+'（'+pc+'%）</span></div>'
      +'<div class="bar"><i class="'+color+'" style="width:'+pc+'%"></i></div>'
      +(sub?'<div class="meta">'+sub+'</div>':'')+'</div>';
  }
  var top='<h1>今日学习 '+today()+'</h1><div class="card"><h2>📊 各模块进度</h2>'
    + bar("📘 408 知识点（已学会）",L408,T408,"","")
    + bar("💻 上机实战（已通过）",SJp,SJt,"g",(SJw>0?("错题本 "+SJw+" 题"):"错题本为空"))
    + bar("🎯 PTA 乙级（已通过）",PTp,PTt,"o",(PTw>0?("错题本 "+PTw+" 题"):"错题本为空"))
    + '</div>';
  document.getElementById("dashTop").innerHTML=top;

  var tips=[];
  if(L408+SJp+PTp===0) tips.push("先点上面「💻 上机实战」第 1 课开始。");
  if(SJw>0) tips.push("上机实战有 "+SJw+" 道错题，进去点 ❌ 错题本重练。");
  if(L408<T408) tips.push("去「📘 408 知识点」再学 3~5 个知识点。");
  if(PTp<PTt) tips.push("去「🎯 PTA 乙级」按顺序做 1~2 节。");
  if(SJp>=SJt && SJp>0) tips.push("上机都过了，冲 PTA 题量或 408 整套复习。");
  if(!tips.length) tips.push("保持节奏，每天进步一点点。");
  document.getElementById("tips").innerHTML = tips.slice(0,3).map(function(t){return "· "+t;}).join("<br>");

  var key="dash_todo_"+today();
  var items; try{ items=JSON.parse(localStorage.getItem(key)||"null"); }catch(e){ items=null; }
  if(!items) items=[{t:"上机实战：完成 1 节",done:false},{t:"408：学会 3 个知识点",done:false},{t:"PTA：做 1 节",done:false}];
  var ul=document.getElementById("todo"); ul.innerHTML="";
  items.forEach(function(it,i){
    var li=document.createElement("li");
    var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=it.done;
    var lb=document.createElement("label"); lb.textContent=it.t; if(it.done) lb.className="done";
    cb.onchange=function(){ items[i].done=cb.checked; localStorage.setItem(key,JSON.stringify(items)); lb.className=cb.checked?"done":""; };
    li.appendChild(cb); li.appendChild(lb); ul.appendChild(li);
  });
}
document.getElementById("refresh").onclick=render;
render();
</script>
</body>
</html>
